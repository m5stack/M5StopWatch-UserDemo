[platformio]
src_dir = main
default_envs = m5stack-stopwatch


[env:m5stack-stopwatch]

; ---------------------------------------------------------------------------
; Platform / framework
; ---------------------------------------------------------------------------

; PIOArduino 55.03.312
;   Arduino-ESP32 3.3.12
;   ESP-IDF 5.5.5
;   SCons 4.11.1
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip

framework = espidf


; ---------------------------------------------------------------------------
; Board
; ---------------------------------------------------------------------------

; ESP32-S3, 16 MB flash, 8 MB OPI PSRAM
board = esp32s3box

; M5Stack-supplied partition table
board_build.partitions = partitions.csv

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

board_build.flash_mode = qio
board_build.f_flash = 80000000L


; ---------------------------------------------------------------------------
; M5Stack StopWatch external ESP-IDF components
; ---------------------------------------------------------------------------

; Materialise the component dependency set below before ESP-IDF/CMake runs.
extra_scripts =
    pre:scripts/fetch_components.py


; ---------------------------------------------------------------------------
; Upload / monitor
; ---------------------------------------------------------------------------

upload_port = /dev/cu.usbmodem1244301
upload_speed = 921600

monitor_speed = 115200

monitor_filters =
    esp32_exception_decoder
    time


; ===========================================================================
; M5Stack StopWatch component dependencies
; ===========================================================================
;
; Format:
;
;   path | repository | ref | optional patch | recursive submodules
;
; These correspond to the dependencies required by the upstream
; M5StopWatch-UserDemo.
;
; Keeping the versions here makes platformio.ini the authoritative
; dependency declaration for PlatformIO builds.
;
; ===========================================================================

[m5_components]

mooncake =
    components/mooncake | https://github.com/Forairaaaaa/mooncake.git | v2.3.3 | | false

mooncake_log =
    components/mooncake_log | https://github.com/Forairaaaaa/mooncake_log.git | v1.5.0 | | false

smooth_ui_toolkit =
    components/smooth_ui_toolkit | https://github.com/Forairaaaaa/smooth_ui_toolkit.git | v2.12.1 | | false

M5GFX =
    components/M5GFX | https://github.com/m5stack/M5GFX.git | 0.2.19 | | false

ArduinoJson =
    components/ArduinoJson | https://github.com/bblanchon/ArduinoJson.git | v7.4.3 | | false

lvgl =
    components/lvgl | https://github.com/lvgl/lvgl.git | v9.5.0 | | false

M5IOE1 =
    components/M5IOE1 | https://github.com/m5stack/M5IOE1.git | 1.0.8 | patches/M5IOE1.patch | false

M5PM1 =
    components/M5PM1 | https://github.com/m5stack/M5PM1.git | 1.0.6 | patches/M5PM1.patch | false

BMI270_BMM150_Sensor =
    components/BMI270_BMM150_Sensor | https://github.com/lbuque/BMI270_BMM150_Sensor.git | 0.1.2 | | true